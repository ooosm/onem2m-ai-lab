# 실습용 conda 환경. Anaconda Navigator → Environments → Import 로 가져오거나
#   conda env create -f environment.yml
# 로 만든다. 버전은 세종대 14-1 강의 환경(Sejong_AIoT_Env.yaml)과 같게 맞췄다.
# 그 파일은 Windows 전용 빌드 번호까지 박혀 있어 다른 OS에서는 설치되지 않으므로,
# 여기서는 버전만 고정해 Windows·macOS·Linux 어디서나 만들어지게 했다.
name: onem2m-ai-lab
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pytorch=2.5.1
  - scikit-learn=1.6.1
  - numpy=2.2
  - requests
  - notebook=7.3
  - ipykernel
